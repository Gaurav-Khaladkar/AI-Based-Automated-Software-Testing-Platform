name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-matrix:
    name: Backend Build & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"
      - name: Compile and Test Backend Core
        run: mvn -B -f backend/pom.xml clean test

  ai-engine-matrix:
    name: AI Intelligence Engine & ML Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-engine/requirements.txt
      - name: Verify AI Model Training & Endpoints
        run: |
          python ai-engine/train_model.py
          pytest ai-engine/

  frontend-matrix:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package.json"
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify Production Bundle
        working-directory: frontend
        run: npm run build

  docker-compose-smoke:
    name: Multi-Container Integration Smoke Test
    needs: [backend-matrix, ai-engine-matrix, frontend-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launch Containers
        run: docker compose up -d --build
      - name: Verify Health Checks
        run: |
          sleep 15
          curl --retry 5 --retry-connrefused http://localhost:5000/health
          curl --retry 5 --retry-connrefused http://localhost:8080/api/testing/jobs
      - name: Teardown
        if: always()
        run: docker compose down
